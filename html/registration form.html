<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION FORM</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form below to register.</p>
    <hr>
    <h2>Personal Details</h2>
    <form>
        <label for="fname">First Name:</label>
        <input type="text" name="userfname" id="fname" placeholder="e.g: Arjun" required>
         <br><br>

        <label for="lname">Last Name:</label>
        <input type="text" name="userlname" id="lname" placeholder="sharma">
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" required>

         <h3>Gender:</h3>
         <label for="Male">Male</label>
         <input type="radio" name="gender" id="male" value="Male">
         <br>

        <label for="Female">Female</label>
        <input type="radio" name="gender" id="Female" value="Female">
        <br>

        <label for="other" >other</label>
         <input type="radio" name="gender" id="other" value="other">

         <h3>Upload Your Details</h3>
         <input type="file" name="photo" id="file" required>
         <label for="file"></label>
         <br>
         <hr>

         <h2>Contact Information</h2>
         <label for="email">Email Address:</label> 
         <input type="email" name="email" id="email" placeholder="you@example.com" required>
         <br><br>
         
         <label for="p.no">Phone Number:</label>
         <input type="number" name="p.no" id="p.no" placeholder="e.g, 9875649823" required>
         <br><br>

         <label for="Address">Mailing Address</label>
         <br>
         <textarea name="Address" id="Address" rows="5" cols="20" placeholder="Street Address,City,State,ZIP Code" required></textarea>
         <br>
         <hr>

         <h2>Academic Information</h2>
         <label for="couse">Select your course  </label>
         <br><br>
         <select name="course" id="course" required>
              <option >- choose your option -</option>
              <option value="CSE">CSE</option>
              <option value="Civil">CE</option>
              <option value="Electronic">EC</option>
         </select>     
         <br>

         <h3>Extracircular Interests:</h3>
         <input type="checkbox" name="hobby" id="hobby" value="sports">
         <label for="hobby">Sports</label>
         <br>

          <input type="checkbox" name="hobby" id="music and arts" value="music and arts">
         <label for="music and arts">music and arts</label>
         <br>

          <input type="checkbox" name="hobby" id="technology and clubs" value="technology and clubs">
         <label for="technology and clubs">technology and clubs</label>
         <br>

         <input type="checkbox" name="hobby" id="volunteer" value="volunteering">
         <label for="volunteer">Volunteering</label>
         <br>
         <hr>

         <h2>Create your Account</h2>
         <label for="password">Create Your password:</label>
         <input type="text" name="password" id="password" required>
         <br><br>

         <label for="personal">Security Question:</label>
         <select name="per.ques" id="personal" required>
            <option value="what is your favorite movie?">what is your favorite movie?</option>
            <option value="what is pet name?">what is your pet name?</option>
         </select>
         <br><br>

         <label for="answer">Security Answer:</label>
         <input type="text" name="answer" id="answer" required>
         <br><br>

         <label for="ok">I agree to the terms and conditions</label>
         <input type="checkbox" id="ok" required>
         <hr>
       
         <button type="submit">Register</button>
         <button type="reset">clear form</button>



         
    </form>

</body>
</html>
