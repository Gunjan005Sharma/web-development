<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
    <h1 style="text-align: center;">Student Registration Form</h1>
    <hr>
    <br>
    <label for="fname">Full Name:</label>
    <input type="text" name="name" id="fname" placeholder="Enter Your Full Name"><br><br>

    <label for="email">Email:</label>
    <input type="email" name="email" id="email" placeholder="Enter valid email address"><br><br>

    <label for="pass">Password</label>
    <input type="password" name="password" id="pass" placeholder="Enter your password">

    <h2>gender:</h2>
    <label for="male">male</label>
    <input type="radio" name="gender" id="male" value="male">

    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" value="Female">

    <label for="other">other</label>
    <input type="radio" name="gender" id="other" value="other"><br><br>
    
    <label for="Course">Course</label>
    <select name="course" id="course">
        <option>-- Select Course --</option>
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
        <option value="EC">EC</option>
    </select>
    <br><br>

    <label for="p.no">Contact No:</label>
    <input type="number" name="phone number" id="p.no" placeholder="Enter Phone Number"><br><br>

    <label for="add">Address:</label><br>
    <textarea name="address" id="add" rows="5" cols="30">Enter your Area</textarea><br><br>

    <button type="submit">Register</button>
    <button type="reset">Clear</button>
    <hr>
  
    </form>
    <footer style="text-align: center;">@ 2025 Registration Form</footer>
</body>
</html>
